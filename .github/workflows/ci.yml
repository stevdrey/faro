name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for PRs; never run untrusted dependencies with repository write access.
permissions:
  contents: read

concurrency:
  group: faro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.8.1'
      - name: Validate Java and Gradle
        run: |
          java -version
          gradle --version
      - name: Compile and test API
        run: gradle -p services/api --no-daemon test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm CLI
        run: npm install --global --ignore-scripts --no-audit npm@12.2.0
      - name: Ensure install scripts are disabled
        run: |
          test "$(npm --prefix apps/web config get ignore-scripts)" = "true"
          npm --prefix apps/web --version
      - name: Install locked dependencies without lifecycle scripts
        run: npm --prefix apps/web ci --ignore-scripts --no-fund
      - name: Verify registry signatures
        run: npm --prefix apps/web audit signatures
      - name: Audit vulnerabilities
        run: npm --prefix apps/web audit --audit-level=high
      - name: Typecheck and build
        run: npm --prefix apps/web run build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

# No uploaded child audio, model weights, credential-bearing artifacts or automatic PR privilege escalation.
