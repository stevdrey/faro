name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for PRs; never run untrusted dependencies with repository write access.
permissions:
  contents: read

concurrency:
  group: faro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.8.1'
      - name: Validate Java and Gradle
        run: |
          java -version
          gradle --version
      - name: Compile and test API
        run: gradle -p services/api --no-daemon test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm CLI
        run: npm install --global --ignore-scripts --no-audit npm@12.2.0
      - name: Ensure install scripts are disabled
        run: |
          test "$(npm --prefix apps/web config get ignore-scripts)" = "true"
          npm --prefix apps/web --version
      - name: Install locked dependencies without lifecycle scripts
        run: npm --prefix apps/web ci --ignore-scripts --no-fund
      - name: Verify registry signatures
        run: npm --prefix apps/web audit signatures
      - name: Audit vulnerabilities
        run: npm --prefix apps/web audit --audit-level=high
      - name: Typecheck and build
        run: npm --prefix apps/web run build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        with:
          fail-on-severity: high

# No uploaded child audio, model weights, credential-bearing artifacts or automatic PR privilege escalation.
