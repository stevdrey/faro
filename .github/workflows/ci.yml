name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for PRs; never run untrusted dependencies with repository write access.
permissions:
  contents: read

concurrency:
  group: faro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whisper-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Test the documented Python 3.11 minimum, not the runner image's default.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Test standalone ASR tooling offline
        run: python3 -m unittest discover -s infra/whisper/tests -v

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.8.1'
      - name: Validate Java and Gradle
        run: |
          java -version
          gradle --version
      - name: Compile and test API
        run: gradle -p services/api --no-daemon test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm CLI
        run: npm install --global --ignore-scripts --no-audit npm@12.2.0
      - name: Ensure install scripts are disabled
        run: |
          test "$(npm --prefix apps/web config get ignore-scripts)" = "true"
          npm --prefix apps/web --version
      - name: Install locked dependencies without lifecycle scripts
        run: npm --prefix apps/web ci --ignore-scripts --no-fund
      - name: Verify registry signatures
        run: npm --prefix apps/web audit signatures
      - name: Audit vulnerabilities
        run: npm --prefix apps/web audit --audit-level=high
      - name: Test interaction state
        run: npm --prefix apps/web run test:unit
      - name: Install test browser explicitly
        run: npm --prefix apps/web run test:install-browser
      - name: Test browser interactions
        run: npm --prefix apps/web run test:e2e
      - name: Typecheck and build
        run: npm --prefix apps/web run build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  agent-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check agent skill mirrors and metadata
        run: |
          set -euo pipefail
          codex=".agents/skills/github-issue-executive-summary/SKILL.md"
          claude=".claude/skills/github-issue-executive-summary/SKILL.md"
          test -f "$codex"
          test -f "$claude"
          cmp "$codex" "$claude"
          grep -qx "name: github-issue-executive-summary" "$codex"
          grep -q "^## Checklist Before Posting$" "$codex"

# No uploaded child audio, model weights, credential-bearing artifacts or automatic PR privilege escalation.
