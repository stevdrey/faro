name: Temporary dependency lock bootstrap

# This read-only workflow exists only to generate the initial lockfiles.
# Remove it as soon as verified lockfiles have been committed to the branch.
on:
  push:
    branches: [chore/java27-react-supply-chain-hardening]

permissions:
  contents: read

jobs:
  npm-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global --ignore-scripts --no-audit npm@12.2.0
      - name: Resolve exact packages without install-time scripts
        run: |
          npm --prefix apps/web install --package-lock-only --ignore-scripts --no-fund
          npm --prefix apps/web ci --ignore-scripts --no-fund
          npm --prefix apps/web run build
      - name: Emit reviewable initial npm lockfile
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const text = fs.readFileSync('apps/web/package-lock.json', 'utf8')
          for (let i = 0; i < text.length; i += 1400) console.log('FARO_NPM_LOCK_CHUNK:' + JSON.stringify(text.slice(i, i + 1400)))
          console.log('FARO_NPM_LOCK_END')
          NODE

  gradle-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.8.1'
      - name: Resolve and verify Gradle dependencies
        run: |
          gradle -p services/api --no-daemon --write-locks test
          gradle -p services/api --no-daemon --write-verification-metadata sha256 test
      - name: Emit initial Gradle lockfile and verification metadata
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          for (const [label, path] of [
            ['FARO_GRADLE_LOCK', 'services/api/gradle.lockfile'],
            ['FARO_GRADLE_VERIFY', 'services/api/gradle/verification-metadata.xml'],
          ]) {
            const text = fs.readFileSync(path, 'utf8')
            for (let i = 0; i < text.length; i += 1400) console.log(label + '_CHUNK:' + JSON.stringify(text.slice(i, i + 1400)))
            console.log(label + '_END')
          }
          NODE
