server:
  address: 127.0.0.1
  port: 8080
spring:
  jackson:
    deserialization:
      fail-on-missing-creator-properties: true
      fail-on-null-for-primitives: true
      fail-on-unknown-properties: true
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# This scaffold does not expose an audio endpoint. FARO-031/040 must
# implement a fail-closed LOCAL_ONLY policy before speech integration.
