server:
  address: 127.0.0.1
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# No audio endpoint or real ASR transport. FARO-040 must enforce LOCAL_ONLY before integration.
# faro.speech.provider has no default; startup fails until a deployment or the dev profile selects one.
faro:
  speech:
    language: es-CR
    timeout: 8s
