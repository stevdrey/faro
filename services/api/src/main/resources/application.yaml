server:
  address: 127.0.0.1
  port: 8080
spring:
  servlet:
    multipart:
      # Raw bounded PCM only. Do not let unsupported multipart uploads create temporary audio files.
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# LOCAL_ONLY is enforced before adapter creation and each request. The synthetic preview stays off.
# faro.speech.provider has no default; startup fails until a deployment or the dev profile selects one.
faro:
  privacy:
    policy: LOCAL_ONLY
  speech:
    language: es-CR
    timeout: 8s
    synthetic-test:
      enabled: false
